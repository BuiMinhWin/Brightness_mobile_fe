name: brightness_mobile
description: "Ứng dụng di động cho dự án Brightness, giúp kết nối và cung cấp thông tin hữu ích."
publish_to: "none" # Ngăn chặn việc publish tình cờ lên pub.dev

# QUAN TRỌNG: Luôn tăng số sau dấu '+' (build number) mỗi khi build để upload lên store.
version: 0.1.0+1

environment:
  # Dùng một khoảng SDK rộng hơn để tương thích tốt hơn
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # Sắp xếp các thư viện theo thứ tự alphabet
  dartz: ^0.10.1
  dio: ^5.4.0 # Giữ lại dio, đã loại bỏ http
  # english_words: ^4.0.0 # CÂN NHẮC: Xóa nếu không dùng đến
  flutter_map: ^6.1.0
  flutter_svg: ^2.2.1
  get_it: ^7.7.0
  image_picker: ^1.0.4
  intl: ^0.20.2
  json_annotation: ^4.9.0
  latlong2: ^0.9.1
  provider: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: "^0.13.1"

  # Sắp xếp các thư viện theo thứ tự alphabet
  build_runner: ^2.4.11
  flutter_lints: ^5.0.0
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true

  assets:
    # Khai báo cả thư mục để đảm bảo không thiếu file
    - assets/images/
    - assets/temps/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/logo.png"

  # Ví dụ về cách khai báo fonts. Bỏ comment và chỉnh sửa nếu bạn có font riêng.
  # fonts:
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro-Regular.ttf
  #       - asset: fonts/TrajanPro-Bold.ttf
  #         weight: 700
